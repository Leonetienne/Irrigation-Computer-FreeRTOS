<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valves</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
    <header class="page-head">
        <div>
            <h1>Valves</h1>
            <p class="subtitle" id="device-name"></p>
        </div>
    </header>

    <nav class="tabs">
        <a href="/" class="active">Valves</a>
        <a href="/settings">Settings</a>
        <a href="/settings/advanced">Advanced</a>
    </nav>

    <div class="card">
        <h2>Valves</h2>
        <div id="valve-list"><div class="spin">Loading…</div></div>
    </div>
</div>

<script>
function parseKeyValues(text) {
    const values = {};
    text.trim().split('\n').filter(Boolean).forEach(line => {
        const i = line.indexOf('=');
        values[line.slice(0, i)] = line.slice(i + 1);
    });
    return values;
}

async function loadDeviceName() {
    const res = await fetch('/api/settings');
    const values = parseKeyValues(await res.text());
    const name = values.device_name || '';
    document.title = name ? name + ' - Valves' : 'Valves';
    document.getElementById('device-name').textContent = name;
}

async function loadValveList() {
    const res = await fetch('/api/valve/config');
    const values = parseKeyValues(await res.text());
    const numValves = Number(values.num_valves) || 0;

    const list = document.getElementById('valve-list');
    list.innerHTML = '';

    if (numValves === 0) {
        list.innerHTML = '<div class="hint">No valves configured yet.</div>';
        return;
    }

    for (let idx = 0; idx < numValves; idx++) {
        const configured = Boolean(values['gpio' + idx]);

        const row = document.createElement('div');
        row.className = 'row';

        const labelWrap = document.createElement('div');
        const label = document.createElement('div');
        label.className = 'label';
        label.textContent = 'Valve ' + idx;
        const stateEl = document.createElement('div');
        stateEl.className = 'state';
        stateEl.id = 'valve-state-' + idx;
        stateEl.textContent = configured ? 'off' : 'please configure gpio';
        labelWrap.appendChild(label);
        labelWrap.appendChild(stateEl);

        const sw = document.createElement('label');
        sw.className = 'switch';
        const input = document.createElement('input');
        input.type = 'checkbox';
        input.id = 'valve-toggle-' + idx;
        input.disabled = !configured;
        input.addEventListener('change', () => toggleValve(idx, input.checked));
        const slider = document.createElement('span');
        slider.className = 'slider';
        sw.appendChild(input);
        sw.appendChild(slider);

        row.appendChild(labelWrap);
        row.appendChild(sw);
        list.appendChild(row);
    }
}

async function loadValveStatus() {
    const res = await fetch('/api/valve/status');
    const text = await res.text();
    text.trim().split('\n').filter(Boolean).forEach(line => {
        const [idx, state] = line.split(':');
        const input = document.getElementById('valve-toggle-' + idx);
        if (!input || input.disabled) return;

        const on = state === '1';
        input.checked = on;
        document.getElementById('valve-state-' + idx).textContent = on ? 'on' : 'off';
    });
}

async function toggleValve(idx, on) {
    await fetch(`/api/valve/${idx}/${on ? 'open' : 'close'}`, {method: 'POST'});
    loadValveStatus();
}

loadDeviceName();
loadValveList().then(loadValveStatus);
</script>
</body>
</html>
