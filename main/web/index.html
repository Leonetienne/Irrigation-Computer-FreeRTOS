<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Irrigation Computer</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            background: #10131a;
            font-family: sans-serif;
            color: #e8e8e8;
        }

        .buttons {
            display: flex;
            gap: 1rem;
        }

        button {
            font-size: 1.2rem;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            background: #2f7bd6;
            color: #fff;
            cursor: pointer;
        }

        button:active {
            background: #1e5aa8;
        }

        .wifi-setup {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            width: 16rem;
        }

        .wifi-setup input {
            font-size: 1rem;
            padding: 0.5rem;
            border: none;
            border-radius: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="buttons">
        <button onclick="setValve('open')">Valve 0 open</button>
        <button onclick="setValve('close')">Valve 0 close</button>
    </div>

    <form class="wifi-setup" onsubmit="return saveWifi()">
        <input id="ssid" type="text" placeholder="WLAN SSID" required>
        <input id="password" type="password" placeholder="WLAN Passwort">
        <button type="submit">WLAN speichern &amp; neu starten</button>
    </form>

    <script>
        function setValve(action) {
            fetch(`/api/valve/0/${action}`, {method: 'POST'});
        }

        function saveWifi() {
            const ssid = document.getElementById('ssid').value;
            const password = document.getElementById('password').value;
            const body = `ssid=${encodeURIComponent(ssid)}&password=${encodeURIComponent(password)}`;
            fetch('/api/wifi', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body,
            });
            return false;
        }
    </script>
</body>
</html>
